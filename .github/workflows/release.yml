# Container release: build and test on every pull request; on master and on a
# version tag, publish a multi-arch (amd64 + arm64) image to GHCR and Docker
# Hub, signed with cosign, with a syft SBOM and build provenance attached.
#
# Docker Hub credentials come from Doppler (project siem-pfsense, config
# ci, shared with the rest of the SIEM stack), never from this repository's
# secrets. The jobs live in
# ChiefGyk3D/git-your-ship-together.
#
# Image: ghcr.io/chiefgyk3d/jumpcloud-wazuh-bridge
name: Release

on:
  push:
    branches: [master, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly rebuild of `latest` from master so base-image fixes reach the
    # published image between commits. Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@f6538c8277d5b02b1c8c8f817dc354c0faaa4622 # v1.2.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      dockerhub: true
      docker-test-command: docker run --rm --entrypoint python3 "$IMAGE" -c "from jumpcloud_wazuh_bridge import config; print('Import OK')"
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
