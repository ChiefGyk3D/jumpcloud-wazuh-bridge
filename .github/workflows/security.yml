# CodeQL, gitleaks, pip-audit and dependency review on pull requests. The jobs
# live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    # Weekly, Sunday 00:00 UTC, so new advisories surface between commits
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@f6538c8277d5b02b1c8c8f817dc354c0faaa4622 # v1.2.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-queries: security-extended,security-and-quality
      pip-audit-requirements: requirements.txt
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
